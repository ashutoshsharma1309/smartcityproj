[project]
name = "urbanpulse-backend"
version = "0.1.0"
description = "UrbanPulse API — predictive urban flood risk and road impact"
requires-python = ">=3.12,<3.14"

# Runtime dependencies for the API process only. The heavy geospatial and ML
# stack (GeoPandas, LightGBM, ...) lives in ml/requirements.txt and runs in the
# offline pipeline, so the API image stays small and starts fast.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "asyncpg>=0.30,<1.0",
    "psycopg[binary]>=3.2,<4.0",     # sync driver, used by Alembic only
    "geoalchemy2>=0.15,<1.0",
    "alembic>=1.14,<2.0",
    "redis>=5.2,<6.0",
    "structlog>=24.4,<26.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.8,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "integration: requires a running PostgreSQL/PostGIS instance",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = [
    "B008",     # FastAPI's Depends() in defaults is the documented pattern.
    "ASYNC109", # Health probes take an explicit timeout budget from Settings and
                # apply it internally with asyncio.wait_for. Passing the budget
                # is the point; the caller must not have to wrap every call.
]

[tool.ruff.lint.per-file-ignores]
# Revisions are generated code: long lines and the unconditional geoalchemy2 /
# postgresql imports from the template are expected.
"alembic/versions/*" = ["E501", "F401"]
